services:
  web:
    image: node:22
    container_name: bg-gaming-web
    working_dir: /app
    command: ["sh", "-ec", "npm install && exec npm run dev -- --host 0.0.0.0 --port 5173"]
    volumes:
      - .:/app
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: on-failure
    labels:
      base44.project: "B&G Gaming"
      base44.kind: "web"
      base44.port: "3000"
